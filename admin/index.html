<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Content Manager</title>
  <style>
    /*
      Decap CMS ships its own React UI with internally-generated class
      names, so most of it can't be reliably targeted with hand-written
      CSS (its own layout is already responsive for the editor/login
      screens in current versions). What we CAN safely control:
        1) a themed loading screen that matches the site instead of a
           blank white flash while the CMS JS boots, and
        2) global guards against horizontal overflow / zoom issues on
           small screens, which is the most common "broken on mobile"
           symptom with third-party embedded apps.
    */
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fcf9f8;
    }
    #cms-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fcf9f8;
      color: #1c1b1b;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #cms-loading.is-hidden { display: none; }
    #cms-loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e5e2e1;
      border-top-color: #7a5830;
      border-radius: 50%;
      animation: cms-spin 0.8s linear infinite;
    }
    #cms-loading p {
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #4f453b;
    }
    @keyframes cms-spin { to { transform: rotate(360deg); } }

    /* Keep any wide, fixed-width editor content from forcing horizontal
       scroll on small screens, without touching Decap's internal DOM. */
    @media (max-width: 640px) {
      #nc-root, #nc-root * { max-width: 100vw; }
      img, table { max-width: 100%; height: auto; }
    }
  </style>
</head>
<body>
  <!-- Themed loading state shown until Decap CMS mounts into #nc-root -->
  <div id="cms-loading">
    <div class="spinner"></div>
    <p>Loading content manager&hellip;</p>
  </div>

  <!-- Include the script that builds the CMS UI -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Redirect logged-in-via-invite links back to /admin/ so the widget can pick up the token
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // Hide the loading screen once Decap CMS has mounted its root, or
    // after a short timeout as a fallback so it never sticks around.
    (function () {
      var loading = document.getElementById('cms-loading');
      function hide() {
        if (loading) loading.classList.add('is-hidden');
      }
      var checkInterval = setInterval(function () {
        if (document.getElementById('nc-root') && document.getElementById('nc-root').childElementCount > 0) {
          hide();
          clearInterval(checkInterval);
        }
      }, 150);
      setTimeout(function () {
        hide();
        clearInterval(checkInterval);
      }, 6000);
    })();
  </script>
</body>
</html>
